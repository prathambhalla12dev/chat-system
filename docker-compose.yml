
services:

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - chat-network
    restart: unless-stopped

  chat-system:
    build: .
    container_name: chat-system
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/chatdb
    depends_on:
      - mongodb
    networks:
      - chat-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  chat-network:
    driver: bridge
